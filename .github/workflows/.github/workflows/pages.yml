name: Publish Astromigos to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Job-scoped permissions are set below; keep the workflow default minimal.
permissions:
  contents: read

# Only one deployment at a time; don't cancel one that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      # Reads the configured Pages base path (e.g. /astromigos) from repo settings.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build with Pages base path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # Normalise to "/name/" (or "/" for an account site / custom domain).
          base="${PAGES_BASE_PATH%/}/"
          echo "Using VITE_BASE_PATH=$base"
          VITE_BASE_PATH="$base" npm run build

      - name: Verify built artifact
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          base="${PAGES_BASE_PATH%/}/"
          VITE_BASE_PATH="$base" npm run verify:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # deploy to Pages
      id-token: write   # verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
